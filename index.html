<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leak Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow+Semi+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --petrol:#1B3038; --petrol2:#223a44; --paper:#F4F2EB; --panel:#FBFAF6;
    --hivis:#F5B324; --alarm:#C93A20; --moss:#3E6E52; --graphite:#5B6462; --line:#DAD5C6;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  body{font-family:'Barlow Semi Condensed','Segoe UI',sans-serif;background:var(--petrol);color:var(--petrol);
    min-height:100vh;-webkit-font-smoothing:antialiased}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes grow{from{width:0}}
  @keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
  button:focus-visible,input:focus-visible{outline:3px solid var(--hivis);outline-offset:2px}

  .app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  .appbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;position:sticky;top:0;background:var(--petrol);border-bottom:1px solid var(--petrol2);z-index:5}
  .brand{display:flex;align-items:center;gap:9px}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:var(--hivis);box-shadow:0 0 0 3px rgba(245,179,36,.2)}
  .brand .nm{font-family:'Barlow Condensed',sans-serif;font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:15px;color:var(--paper)}
  .barstep{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8ea3ac;letter-spacing:.06em}
  .screen{flex:1;padding:22px 18px 30px;animation:rise .3s ease;display:flex;flex-direction:column}
  .screen.center{justify-content:center;padding-bottom:64px}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:32px 28px}
  h1{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:50px;line-height:1.02;margin:0 0 16px;text-transform:uppercase}
  h1 .red{color:var(--alarm)}
  h2{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:29px;line-height:1.12;margin:0 0 8px}
  p{font-size:18px;color:var(--graphite);line-height:1.55;margin-bottom:10px}
  @media (max-width:640px){ h1{font-size:39px;margin-bottom:14px} h2{font-size:26px} .panel{padding:26px 22px} }
  .mono{font-family:'IBM Plex Mono',monospace}

  .gets{list-style:none;margin:4px 0 18px}
  .gets li{display:flex;align-items:flex-start;gap:11px;font-size:18px;color:var(--petrol);margin-bottom:11px;line-height:1.4;font-weight:500}
  .gets .tk{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;background:var(--moss);color:#fff;font-size:15px;font-weight:800;flex:0 0 auto;margin-top:1px}
  .trust{font-size:15px;color:var(--graphite);line-height:1.45;margin:0 0 20px}
  .trust b{color:var(--petrol)}

  .prog{height:6px;background:var(--petrol2);border-radius:3px;margin:0 0 22px;overflow:hidden}
  .prog .fill{height:100%;background:var(--hivis);border-radius:3px;transition:width .3s ease}

  .qnum{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--graphite);text-transform:uppercase;margin-bottom:8px}
  .chip{display:flex;align-items:center;width:100%;text-align:left;padding:16px 18px;margin-bottom:11px;background:#fff;color:var(--petrol);
    border:2px solid var(--line);border-radius:9px;font-family:inherit;font-size:18px;font-weight:500;line-height:1.3;cursor:pointer;transition:.12s}
  .chip:hover{border-color:var(--petrol)}
  .chip.on{background:var(--petrol);color:var(--paper);border-color:var(--petrol);animation:pop .2s ease}
  .chip .ic{width:30px;font-size:22px;margin-right:8px;text-align:center;flex:0 0 auto}
  .big{width:100%;padding:19px;background:var(--hivis);color:var(--petrol);border:none;border-radius:10px;
    font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  .big[disabled]{background:var(--line);cursor:default}
  .ghost{width:100%;padding:12px;background:transparent;border:none;color:var(--graphite);font-family:'IBM Plex Mono',monospace;font-size:13px;cursor:pointer}

  /* interactive number = big value + slider */
  .rngval{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:6px 0 16px}
  .rngval .pre{font-family:'IBM Plex Mono',monospace;font-size:34px;font-weight:700;color:var(--petrol)}
  .rngval input{width:auto;max-width:210px;text-align:center;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:38px;border:none;border-bottom:2px dashed var(--line);background:transparent;color:var(--petrol);padding:2px 4px}
  .rngval .unit{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:500;color:var(--graphite)}
  input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:8px;border-radius:4px;background:var(--line);outline:none;margin:2px 0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--hivis);border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.3);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--hivis);border:3px solid #fff;cursor:pointer}
  .rnghint{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--graphite);margin:8px 0 18px}

  .metric{background:var(--petrol);border-radius:12px;padding:22px;margin-bottom:14px;color:var(--paper)}
  .metric .ml{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8ea3ac;margin-bottom:6px}
  .metric .mv{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:48px;line-height:1;color:var(--hivis)}
  .metric .mw{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--paper);margin-top:9px;line-height:1.4}
  .readline{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:21px;line-height:1.2;color:var(--petrol);margin:0 0 16px}

  .cmp{background:#fff;border:1px solid var(--line);border-radius:11px;padding:16px 17px;margin:0 0 16px}
  .cmp .h{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--graphite);margin-bottom:12px}
  .cmprow{margin-bottom:11px}
  .cmprow:last-child{margin-bottom:0}
  .cmprow .lab{display:flex;justify-content:space-between;font-size:14px;color:var(--petrol);margin-bottom:5px;font-weight:500}
  .cmpbar{height:11px;background:var(--line);border-radius:6px;overflow:hidden}
  .cmpbar i{display:block;height:100%;border-radius:6px;animation:grow .7s ease}
  .cmpbar.you i{background:var(--alarm)}
  .cmpbar.tight i{background:var(--moss)}

  .tile{background:var(--panel);border:1px solid var(--line);border-radius:11px;margin-bottom:11px;overflow:hidden}
  .tile.p1{border-color:var(--alarm);border-width:2px}
  .thead{display:flex;align-items:center;gap:12px;padding:16px;cursor:pointer}
  .rank{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:12px;color:var(--paper);background:var(--graphite);min-width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center}
  .tile.p1 .rank{background:var(--alarm)}
  .tmid{flex:1;min-width:0}
  .ttitle{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:19px;text-transform:uppercase;line-height:1.05}
  .tsev{height:5px;background:var(--line);border-radius:3px;margin-top:7px;overflow:hidden}
  .tsev i{display:block;height:100%;background:var(--alarm);border-radius:3px;animation:grow .6s ease}
  .tcost{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:16px;color:var(--alarm);white-space:nowrap}
  .caret{color:var(--graphite);font-size:13px;font-family:'IBM Plex Mono',monospace;transition:.15s}
  .tile.open .caret{transform:rotate(90deg)}
  .tbody{max-height:0;overflow:hidden;transition:max-height .25s ease}
  .tile.open .tbody{max-height:340px}
  .tbody .in{padding:0 16px 16px 52px}
  .tbody .why{font-size:16px;color:var(--graphite);line-height:1.5}

  .action{background:var(--hivis);border-radius:11px;padding:15px 17px;margin:16px 0 6px}
  .action b{font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;font-size:13px;letter-spacing:.08em;color:var(--petrol);display:block;margin-bottom:3px}
  .action span{font-size:16px;color:var(--petrol)}

  .sellbar{border:1px solid var(--line);border-radius:11px;padding:16px 17px;margin-top:18px;background:var(--panel)}
  .sellbar .st{font-size:15px;color:var(--graphite);line-height:1.5;margin-bottom:12px}
  .sellbar .st b{color:var(--petrol)}
  .foot{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8ea3ac;margin-top:16px;text-align:center;line-height:1.5}
  .fld{margin-bottom:10px}
  .fld input{width:100%;padding:15px 16px;font-size:19px;font-family:inherit;color:var(--petrol);border:2px solid var(--line);border-radius:9px;background:#fff}
</style>
</head>
<body>
<div class="app">
  <div class="appbar">
    <div class="brand"><span class="dot"></span><span class="nm">Leak Finder</span></div>
    <span class="barstep" id="barstep"></span>
  </div>
  <div class="screen" id="app"></div>
</div>

<script>
(function(){
  /* =================== CONFIG =================== */
  var CONFIG = {
    JACK_WA: "353894794158",
    WORKER_URL: "",
    WEEKS: 48, RATE: 45, CAPTURE: 0.30, DESK_FLOOR: 3500, TOTAL_SHARE: 0.15, TIGHT: 0.05, BIZ: "Cork"
  };

  var MID = {
    price:{ year:0.03, twoyr:0.06, longer:0.09, never:0.12 },
    quote:{ same:0, days:0.055, evening:0.13, never:0.21 },
    paid:{ days:0, week:0.015, month:0.035, chasing:0.05 },
    admin:{ few:1.5, evening:3.5, day:7.5, moreday:12 },
    missedCount:{ none:0, some:2, lots:7, noidea:4 },
    missedShare:{ none:0, some:0.02, lots:0.05, noidea:0.03 }
  };

  var SHAPE_LABEL = { callout:"a callouts operation", project:"a projects business", contract:"a contract business", varied:"a business like yours" };

  var QUESTIONS = [
    {id:"type", q:"What's your trade?", type:"chips",
      opts:[
        {t:"Landscaping / gardens", v:"Landscaping / gardens", i:"🌿"},
        {t:"Plumbing / heating", v:"Plumbing / heating", i:"🔧"},
        {t:"Electrical", v:"Electrical", i:"⚡"},
        {t:"Building / carpentry", v:"Building / carpentry", i:"🧱"},
        {t:"Roofing / groundworks", v:"Roofing / groundworks", i:"🏠"},
        {t:"Another trade", v:"Another trade", i:"🛠️"}
      ]},

    {id:"shape", q:"How does the work mostly come in?", type:"chips",
      opts:[
        {t:"Lots of small jobs and callouts", v:"callout", i:"📞"},
        {t:"Bigger jobs or projects that run for weeks or months", v:"project", i:"🏗️"},
        {t:"Ongoing contracts or the same regular clients", v:"contract", i:"📋"},
        {t:"All sorts, no two weeks the same", v:"varied", i:"🔀"}
      ]},

    {id:"jobValue", when:function(a){return a.shape==="callout";}, q:"Rough price of a typical callout or small job?", type:"range", prefix:"€", min:0, max:3000, step:10, def:250, hint:"Slide it, or tap the number to type. A rough figure is grand."},
    {id:"jobsWeek", when:function(a){return a.shape==="callout";}, q:"In a normal week, roughly how many do you do?", type:"range", min:0, max:40, step:1, def:8, unit:"a week", hint:"Ballpark, a busy week and a quiet week averaged out."},

    {id:"projValue", when:function(a){return a.shape==="project";}, q:"Rough value of a typical project?", type:"range", prefix:"€", min:0, max:100000, step:500, def:20000, hint:"Middle of the road, not your biggest ever."},
    {id:"projYear", when:function(a){return a.shape==="project";}, q:"How many of those do you take on in a year?", type:"range", min:0, max:40, step:1, def:5, unit:"a year", hint:"Roughly. Even one or two is a real answer."},

    {id:"monthly", when:function(a){return a.shape==="contract";}, q:"Roughly what do the main contracts bring in a month?", type:"range", prefix:"€", min:0, max:60000, step:250, def:8000, hint:"A rough monthly figure is all I need."},
    {id:"monthly", when:function(a){return a.shape==="varied";}, q:"Roughly what comes in over a month, across everything?", type:"range", prefix:"€", min:0, max:60000, step:250, def:7000, hint:"A rough monthly figure is all I need. It never leaves your phone."},

    {id:"missed", q:"A call or enquiry comes in and you can't get to it. What usually happens?", type:"chips",
      opts:[
        {t:"We get back to every one, no exceptions", v:"none"},
        {t:"Most of them, but some slip", v:"some"},
        {t:"A fair few never get chased back", v:"lots"},
        {t:"No idea, honestly, and that's probably the answer", v:"noidea"}
      ]},
    {id:"quotes", q:"When someone wants a price, how quick does it actually go out?", type:"chips",
      opts:[
        {t:"Same day, while it's fresh", v:"same"},
        {t:"Within a few days", v:"days"},
        {t:"When I get a spare evening", v:"evening"},
        {t:"Some never go out at all", v:"never"}
      ]},
    {id:"invoicing", q:"From finishing the work to money in the bank, how long?", type:"chips",
      opts:[
        {t:"Paid within a few days", v:"days"},
        {t:"A week or two", v:"week"},
        {t:"Often a month or more", v:"month"},
        {t:"I'm forever chasing people", v:"chasing"}
      ]},
    {id:"priceRaise", q:"When did you last put your prices or rates up?", type:"chips",
      opts:[
        {t:"In the last year", v:"year"},
        {t:"One to two years back", v:"twoyr"},
        {t:"Longer than that", v:"longer"},
        {t:"Never, same prices for years", v:"never"}
      ]},
    {id:"admin", q:"Hours a week on the office side, quotes, calls, paperwork, chasing?", type:"chips",
      opts:[
        {t:"Just a few", v:"few"},
        {t:"Most of an evening", v:"evening"},
        {t:"The best part of a day", v:"day"},
        {t:"More than a day a week", v:"moreday"}
      ]}
  ];

  var app = document.getElementById("app");
  var barstep = document.getElementById("barstep");
  var screen = "intro", step = 0, answers = {}, report = null;

  function euro(n){ return "€" + Math.round(Number(n)||0).toLocaleString("en-IE"); }
  function round100(n){ return Math.round((Number(n)||0)/100)*100; }
  function setStep(s){ barstep.textContent = s || ""; }
  function active(){ return QUESTIONS.filter(function(q){ return !q.when || q.when(answers); }); }

  function annualRevenue(a){
    if(a.shape==="callout") return (Number(a.jobValue)||0) * (Number(a.jobsWeek)||0) * CONFIG.WEEKS;
    if(a.shape==="project") return (Number(a.projValue)||0) * (Number(a.projYear)||0);
    return (Number(a.monthly)||0) * 12;
  }

  function analyse(a){
    var annualRev = annualRevenue(a);
    var adminHrs = MID.admin[a.admin] || 0;
    var priceF = MID.price[a.priceRaise] || 0;
    var quoteF = MID.quote[a.quotes] || 0;
    var paidF  = MID.paid[a.invoicing] || 0;

    var undercharge = Math.round(annualRev * priceF);
    var adminCost   = Math.round(adminHrs * CONFIG.RATE * CONFIG.WEEKS);
    var quoteCost   = Math.round(annualRev * quoteF);
    var paidCost    = Math.round(annualRev * paidF);
    var missedCost;
    if(a.shape==="callout"){
      var mc = MID.missedCount[a.missed] || 0;
      missedCost = Math.round(mc * CONFIG.CAPTURE * (Number(a.jobValue)||0) * CONFIG.WEEKS);
    } else {
      missedCost = Math.round(annualRev * (MID.missedShare[a.missed] || 0));
    }

    var leaks = [];
    if(undercharge>0) leaks.push({title:"Charging too little", cost:undercharge, mk:function(c){
      return "On roughly "+euro(annualRev)+" a year going through the business, your prices are "+(priceF>=0.1?"well overdue a rise":"due a nudge")+". A rise your good clients will not flinch at is about "+euro(c)+" a year for the exact same work.";}});
    if(missedCost>0) leaks.push({title:"Work slipping away", cost:missedCost, mk:function(c){
      if(a.shape==="callout") return "You miss a fair share of calls, and a missed one is a job that rings the next fella instead. Even a slice of them booking is about "+euro(c)+" a year walking out the door.";
      return "Enquiries that come in and never get chased back are work someone else picked up. On your numbers that is roughly "+euro(c)+" a year.";}});
    if(quoteCost>0) leaks.push({title:"Quotes going cold", cost:quoteCost, mk:function(c){
      return "A price that lands days late, or never, is work that went to whoever answered quicker. That is costing you around "+euro(c)+" a year.";}});
    if(paidCost>0) leaks.push({title:"Money you're owed sitting out", cost:paidCost, mk:function(c){
      return "Work you have already done, still waiting to be paid for, and some of it quietly never lands. Conservatively that is about "+euro(c)+" a year at risk.";}});
    if(adminCost>=CONFIG.DESK_FLOOR) leaks.push({title:"Your time buried in the office", cost:adminCost, mk:function(c){
      return "About "+adminHrs+" hours a week gone on the desk instead of on the tools or at home. Valued at a skilled rate that is around "+euro(c)+" a year.";}});

    leaks.sort(function(x,y){return y.cost-x.cost;});
    leaks = leaks.slice(0,3);

    var rawTotal = leaks.reduce(function(s,l){return s+l.cost;},0);
    var cap = Math.round(annualRev * CONFIG.TOTAL_SHARE);
    if(cap>0 && rawTotal>cap){ var f=cap/rawTotal; for(var k=0;k<leaks.length;k++) leaks[k].cost=Math.round(leaks[k].cost*f); }
    /* never show two identical figures side by side, it reads as a formula */
    for(var d=1; d<leaks.length; d++){ if(leaks[d].cost===leaks[d-1].cost) leaks[d].cost = Math.max(1, Math.round(leaks[d].cost*0.92)); }
    for(var j=0;j<leaks.length;j++) leaks[j].why = leaks[j].mk(leaks[j].cost);

    var total = leaks.reduce(function(s,l){return s+l.cost;},0);
    var mid = round100(total);
    var low = round100(total*0.8), high = round100(total*1.2);
    var leakPct = annualRev>0 ? total/annualRev : 0;
    var strong = total >= 8000;
    var lab = SHAPE_LABEL[a.shape] || "a business like yours";
    var headline;
    if(leaks.length===0) headline = "You run a genuinely tight ship. Nothing here worth chasing, and that is a good answer to have.";
    else if(strong) headline = "For "+lab+", there is real money slipping out the side, every week you leave it.";
    else headline = "For "+lab+", not a fortune, but there is money here worth tightening up.";

    var quickWin;
    if(!leaks.length) quickWin = "";
    else if(leaks[0].title==="Charging too little") quickWin = "Add 10 percent to the next price you send. Nobody good will blink, and it is money for nothing changed.";
    else if(leaks[0].title==="Quotes going cold") quickWin = "Send the next quote the same day, even a rough one. Speed wins the job more than the price does.";
    else if(leaks[0].title.indexOf("owed")>-1) quickWin = "Put a payment link or your IBAN straight on the invoice and send it the day you finish. It gets you paid faster for free.";
    else if(leaks[0].title==="Work slipping away") quickWin = "Set a simple text-back on your missed calls this week. It holds the job while you finish the one you are on.";
    else quickWin = "Block one hour, same time each week, for the office side. Doing it in one go beats it bleeding into every evening.";

    return { total:mid, low:low, high:high, leaks:leaks, headline:headline, quickWin:quickWin, annualRev:annualRev, leakPct:leakPct };
  }

  function countUp(el, to){
    if(!window.requestAnimationFrame){ el.textContent = euro(to); return; }
    var dur=900, t0=null;
    function fr(ts){ if(!t0)t0=ts; var p=Math.min(1,(ts-t0)/dur); el.textContent=euro(Math.round(to*p)); if(p<1) requestAnimationFrame(fr); }
    requestAnimationFrame(fr);
  }

  function render(){
    app.className = "screen" + (screen==="intro" ? " center" : "");

    if(screen==="intro"){
      setStep("");
      app.innerHTML =
        '<div class="panel">'+
          '<h1>You are flat out every week. So where is the <span class="red">money going</span>?</h1>'+
          '<p style="margin-bottom:14px">A few straight questions about how the work actually runs. Built for Cork trades, plumbers, sparks, builders, landscapers, groundworkers.</p>'+
          '<ul class="gets">'+
            '<li><span class="tk">✓</span><div>Your biggest money leaks, put in real euro</div></li>'+
            '<li><span class="tk">✓</span><div>How you compare to a tight operator</div></li>'+
            '<li><span class="tk">✓</span><div>Two minutes, and the one thing to fix first</div></li>'+
          '</ul>'+
          '<p class="trust"><b>No email, no sign up, no sales call unless you ask for one.</b> Your figures stay on your phone.</p>'+
          '<button class="big" id="start">Show me where</button>'+
        '</div>'+
        '<p class="foot">By Jack. I find where Cork trades lose money and help plug it.</p>';
      document.getElementById("start").onclick = function(){ screen="quiz"; step=0; render(); };
      return;
    }

    if(screen==="quiz"){
      var list = active();
      if(step >= list.length) step = list.length-1;
      var qq = list[step];
      setStep((step+1)+" / "+list.length);
      var pct = Math.round((step/list.length)*100);
      var body = '<div class="prog"><div class="fill" style="width:'+pct+'%"></div></div>'+
        '<div class="panel"><div class="qnum">Question '+(step+1)+'</div>'+
        '<h2>'+qq.q+'</h2>'+ (qq.hint?'<p style="margin:0 0 16px">'+qq.hint+'</p>':'<div style="height:14px"></div>');
      var backBtn = step>0 ? '<button class="ghost" id="bk">&#8592; Back</button>' : '';

      if(qq.type==="chips"){
        for(var i=0;i<qq.opts.length;i++){
          var o = qq.opts[i];
          var lab = (o && typeof o==="object") ? o.t : o;
          var val = (o && typeof o==="object") ? o.v : o;
          var ic  = (o && typeof o==="object" && o.i) ? '<span class="ic">'+o.i+'</span>' : '';
          var on = (answers[qq.id]===val) ? " on" : "";
          body += '<button class="chip'+on+'" data-v="'+String(val).replace(/"/g,'&quot;')+'">'+ic+'<span>'+lab+'</span></button>';
        }
        body += backBtn + '</div>';
        app.innerHTML = body;
        var chips = app.querySelectorAll(".chip");
        for(var c=0;c<chips.length;c++) chips[c].onclick = (function(ch){return function(){ next(qq.id, ch.getAttribute("data-v")); };})(chips[c]);
        var bk1=document.getElementById("bk"); if(bk1) bk1.onclick=goBack;
        return;
      }
      if(qq.type==="range"){
        var cur = (answers[qq.id]!=null && answers[qq.id]!=="") ? answers[qq.id] : qq.def;
        body += '<div class="rngval">'+(qq.prefix?'<span class="pre">'+qq.prefix+'</span>':'')+
            '<input type="number" inputmode="numeric" id="rv" value="'+cur+'">'+
            (qq.unit?'<span class="unit">'+qq.unit+'</span>':'')+'</div>'+
          '<input type="range" id="rs" min="'+qq.min+'" max="'+qq.max+'" step="'+qq.step+'" value="'+cur+'">'+
          '<div class="rnghint"><span>'+(qq.prefix||"")+qq.min+'</span><span>'+(qq.prefix||"")+qq.max.toLocaleString("en-IE")+'+</span></div>'+
          '<button class="big" id="nx"'+(cur>0?"":" disabled")+'>Next</button>'+ backBtn + '</div>';
        app.innerHTML = body;
        var rv=document.getElementById("rv"), rs=document.getElementById("rs"), nx=document.getElementById("nx");
        function setDis(v){ nx.disabled = !((Number(v)||0)>0); }
        rs.oninput=function(){ rv.value=rs.value; setDis(rs.value); };
        rv.oninput=function(){ var v=Math.max(0,Number(rv.value)||0); rs.value = (v>Number(qq.max)? qq.max : v); setDis(v); };
        nx.onclick=function(){ var v=Math.max(0,Number(rv.value)||0); if(v>0) next(qq.id, v); };
        var bk2=document.getElementById("bk"); if(bk2) bk2.onclick=goBack;
        return;
      }
    }

    if(screen==="analysing"){
      setStep("");
      app.innerHTML = '<div class="panel" style="text-align:center;padding:46px 22px">'+
        '<div style="font-family:\'Barlow Condensed\',sans-serif;font-weight:800;font-size:30px;text-transform:uppercase;margin-bottom:10px">Running your numbers</div>'+
        '<div class="mono" id="busyLine" style="font-size:14px;color:var(--graphite)">Checking the pipes...</div></div>';
      var lines = ["Checking the pipes...","Costing the leaks...","Comparing you to a tight operator...","Writing up the findings..."];
      var bi=0; if(window.__busy) clearInterval(window.__busy);
      window.__busy = setInterval(function(){ bi=(bi+1)%lines.length; var e=document.getElementById("busyLine"); if(e){ e.textContent=lines[bi]; } else { clearInterval(window.__busy); } }, 1200);
      return;
    }

    if(screen==="report" && report){
      if(window.__busy){ clearInterval(window.__busy); window.__busy=null; }
      setStep("Report");
      var top = report.leaks.length ? report.leaks[0].cost : 1;
      var inner = '<div class="metric"><div class="ml">Rough money leaking a year</div>'+
        '<div class="mv">€0</div>'+
        (report.leaks.length ? '<div class="mw">Give or take, somewhere between '+euro(report.low)+' and '+euro(report.high)+' a year, on your own numbers.</div>' : '')+
        '</div>'+
        '<p class="readline">'+report.headline+'</p>';

      if(report.leaks.length && report.annualRev>0){
        var youPct = Math.max(1, Math.round(report.leakPct*100));
        var tightPct = Math.round(CONFIG.TIGHT*100);
        var scale = Math.max(youPct, tightPct, 12);
        inner += '<div class="cmp"><div class="h">How you compare</div>'+
          '<div class="cmprow"><div class="lab"><span>You right now</span><span>'+youPct+'% of turnover</span></div><div class="cmpbar you"><i style="width:'+Math.round(youPct/scale*100)+'%"></i></div></div>'+
          '<div class="cmprow"><div class="lab"><span>A tight operator</span><span>under '+tightPct+'%</span></div><div class="cmpbar tight"><i style="width:'+Math.round(tightPct/scale*100)+'%"></i></div></div>'+
          '</div>';
      }

      for(var i=0;i<report.leaks.length;i++){
        var l = report.leaks[i];
        var w = Math.max(8, Math.round(l.cost/top*100));
        var openCls = i===0 ? " open" : "";
        inner += '<div class="tile'+(i===0?" p1":"")+openCls+'">'+
          '<div class="thead">'+
            '<span class="rank">'+(i+1)+'</span>'+
            '<div class="tmid"><div class="ttitle">'+l.title+'</div><div class="tsev"><i style="width:'+w+'%"></i></div></div>'+
            '<span class="tcost">~'+euro(l.cost)+'/yr</span>'+
            '<span class="caret">&#9656;</span>'+
          '</div>'+
          '<div class="tbody"><div class="in"><p class="why">'+l.why+'</p></div></div>'+
        '</div>';
      }

      if(report.leaks.length && report.quickWin){
        inner += '<div class="action"><b>One free win to get you started</b><span>'+report.quickWin+'</span></div>';
      }

      var sell;
      if(report.leaks.length){
        sell = '<div class="st">That is the free read, off a two minute chat. The paid <b>assessment</b> is a proper look at the <b>'+euro(report.total)+' a year</b> above: every leak pinned down in euro, the exact fix for each, and a plan you can actually run. <b>€499</b> for my first three Cork trades, €999 after.</div>'+
          '<button class="big" id="fix">Book the call about your '+euro(report.total)+'</button>';
      } else {
        sell = '<div class="st">You run a tight ship, so there is no big leak to chase here. If you want a proper set of eyes over the whole business anyway, the paid <b>assessment</b> is a call and a written plan. <b>€499</b>, my first three Cork trades, €999 after.</div>'+
          '<button class="big" id="fix">Book a 15 minute call</button>';
      }
      inner += '<div class="sellbar">'+sell+'</div>'+
        '<p class="foot">15 minutes, no charge, no hard sell. Assessment by Jack, '+CONFIG.BIZ+'</p>';

      app.innerHTML = inner;
      var mv = app.querySelector(".mv"); if(mv) countUp(mv, report.total);
      var tiles = app.querySelectorAll(".tile");
      for(var ti=0; ti<tiles.length; ti++){
        tiles[ti].querySelector(".thead").onclick = (function(el){ return function(){ el.classList.toggle("open"); }; })(tiles[ti]);
      }
      document.getElementById("fix").onclick = function(){ screen="capture"; render(); };
      return;
    }

    if(screen==="capture"){
      setStep("Book");
      app.innerHTML = '<div class="panel">'+
        '<h2>Book your 15 minute call</h2>'+
        '<p>You are probably thinking this is where the sales calls start. Fair enough. It is one call, 15 minutes, no charge and no hard sell. If it is not worth your time you will know inside five minutes.</p>'+
        '<p>Leave your details and I will sort a time that suits.</p>'+
        '<div class="fld"><input id="cname" placeholder="Your name"></div>'+
        '<div class="fld"><input id="cbiz" placeholder="Business name"></div>'+
        '<div class="fld"><input id="cphone" placeholder="Phone or WhatsApp"></div>'+
        '<button class="big" id="send">Book it with Jack</button>'+
        '<button class="ghost" id="back">Back to my results</button>'+
        '</div>';
      document.getElementById("back").onclick = function(){ screen="report"; render(); };
      document.getElementById("send").onclick = function(){
        var name = (document.getElementById("cname").value||"").trim();
        var biz = (document.getElementById("cbiz").value||"").trim();
        var phone = (document.getElementById("cphone").value||"").trim();
        var lines = ["Hi Jack, I did the leak assessment and want to book the 15 minute call."];
        if(name) lines.push("Name: "+name);
        if(biz) lines.push("Business: "+biz);
        if(phone) lines.push("Phone: "+phone);
        lines.push("Trade: "+(answers.type||"?"));
        lines.push("Rough leak: "+euro(report.total)+" a year");
        for(var i=0;i<report.leaks.length;i++) lines.push("- "+report.leaks[i].title+": ~"+euro(report.leaks[i].cost)+"/yr");
        var url = "https://wa.me/"+CONFIG.JACK_WA+"?text="+encodeURIComponent(lines.join("\n"));
        window.open(url,"_blank");
      };
      return;
    }
  }

  function next(id, val){
    answers[id] = val;
    var list = active();
    if(step+1 < list.length){ step++; render(); }
    else { runReport(); }
  }
  function goBack(){ if(step>0){ step--; render(); } }

  function runReport(){
    report = null; screen = "analysing"; render();
    if(!CONFIG.WORKER_URL){ setTimeout(function(){ report = analyse(answers); screen="report"; render(); }, 1100); return; }
    var done = false;
    function fallback(){ if(done) return; done=true; report = analyse(answers); screen="report"; render(); }
    var timer = setTimeout(fallback, 20000);
    fetch(CONFIG.WORKER_URL, {method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify(answers)})
      .then(function(r){ return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function(rep){ if(done) return; done=true; clearTimeout(timer);
        report = (rep && rep.leaks && rep.leaks.length && !rep.error) ? rep : analyse(answers); screen="report"; render(); })
      .catch(function(){ clearTimeout(timer); fallback(); });
  }

  render();
})();
</script>
</body>
</html>
