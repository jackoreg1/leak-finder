<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leak Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow+Semi+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --petrol:#1B3038; --petrol2:#223a44; --paper:#F4F2EB; --panel:#FBFAF6;
    --hivis:#F5B324; --alarm:#C93A20; --moss:#3E6E52; --graphite:#5B6462; --line:#DAD5C6;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  body{font-family:'Barlow Semi Condensed','Segoe UI',sans-serif;background:var(--petrol);color:var(--petrol);
    min-height:100vh;-webkit-font-smoothing:antialiased}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes grow{from{width:0}}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--hivis);outline-offset:2px}

  /* ---------- app shell ---------- */
  .app{max-width:600px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  .appbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;position:sticky;top:0;background:var(--petrol);border-bottom:1px solid var(--petrol2);z-index:5}
  .brand{display:flex;align-items:center;gap:9px}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:var(--hivis);box-shadow:0 0 0 3px rgba(245,179,36,.2)}
  .brand .nm{font-family:'Barlow Condensed',sans-serif;font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:15px;color:var(--paper)}
  .barstep{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8ea3ac;letter-spacing:.06em}
  .screen{flex:1;padding:20px 16px 28px;animation:rise .3s ease}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 20px}
  h1{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:38px;line-height:1.03;margin:0 0 12px;text-transform:uppercase}
  h1 .red{color:var(--alarm)}
  h2{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:25px;line-height:1.12;margin:0 0 6px}
  p{font-size:16px;color:var(--graphite);line-height:1.5;margin-bottom:8px}
  .mono{font-family:'IBM Plex Mono',monospace}

  .prog{height:6px;background:var(--petrol2);border-radius:3px;margin:0 0 22px;overflow:hidden}
  .prog .fill{height:100%;background:var(--hivis);border-radius:3px;transition:width .3s ease}

  .qnum{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--graphite);text-transform:uppercase;margin-bottom:8px}
  .chip{display:block;width:100%;text-align:left;padding:15px 16px;margin-bottom:10px;background:#fff;color:var(--petrol);
    border:2px solid var(--line);border-radius:9px;font-family:inherit;font-size:16px;font-weight:500;cursor:pointer;transition:.12s}
  .chip:hover{border-color:var(--petrol)}
  .chip.on{background:var(--petrol);color:var(--paper);border-color:var(--petrol)}
  .big{width:100%;padding:16px;background:var(--hivis);color:var(--petrol);border:none;border-radius:9px;
    font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:19px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  .big[disabled]{background:var(--line);cursor:default}
  .ghost{width:100%;padding:12px;background:transparent;border:none;color:var(--graphite);font-family:'IBM Plex Mono',monospace;font-size:13px;cursor:pointer}

  input,textarea{width:100%;padding:14px 16px;font-size:18px;font-family:inherit;color:var(--petrol);
    border:2px solid var(--line);border-radius:9px;background:#fff}
  textarea{min-height:118px;resize:vertical;line-height:1.45}
  .numrow{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .numrow .pre{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:700}
  .numrow input{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:22px}
  .micnote{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--graphite);margin:10px 0 14px}

  /* ---------- results dashboard ---------- */
  .metric{background:var(--petrol);border-radius:12px;padding:20px;margin-bottom:14px;color:var(--paper)}
  .metric .ml{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8ea3ac;margin-bottom:6px}
  .metric .mv{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:48px;line-height:1;color:var(--hivis)}
  .metric .mw{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--paper);margin-top:8px}
  .metric .mw b{color:var(--alarm);background:#fff;padding:1px 6px;border-radius:4px}
  .readline{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:19px;line-height:1.2;color:var(--petrol);margin:0 0 16px}

  .tile{background:var(--panel);border:1px solid var(--line);border-radius:11px;margin-bottom:11px;overflow:hidden}
  .tile.p1{border-color:var(--alarm);border-width:2px}
  .thead{display:flex;align-items:center;gap:12px;padding:15px 16px;cursor:pointer}
  .rank{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:12px;color:var(--paper);background:var(--graphite);min-width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center}
  .tile.p1 .rank{background:var(--alarm)}
  .tmid{flex:1;min-width:0}
  .ttitle{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;text-transform:uppercase;line-height:1.05}
  .tsev{height:5px;background:var(--line);border-radius:3px;margin-top:7px;overflow:hidden}
  .tsev i{display:block;height:100%;background:var(--alarm);border-radius:3px;animation:grow .6s ease}
  .tcost{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:16px;color:var(--alarm);white-space:nowrap}
  .caret{color:var(--graphite);font-size:13px;font-family:'IBM Plex Mono',monospace;transition:.15s}
  .tile.open .caret{transform:rotate(90deg)}
  .tbody{max-height:0;overflow:hidden;transition:max-height .25s ease}
  .tile.open .tbody{max-height:320px}
  .tbody .in{padding:0 16px 16px 52px}
  .tbody .why{font-size:15px;color:var(--graphite);line-height:1.5}

  .words{background:#fff;border-left:5px solid var(--hivis);border-radius:9px;padding:14px 16px;margin:16px 0 4px}
  .words .wl{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--graphite);margin-bottom:6px}
  .words .wt{font-size:16px;color:var(--petrol);font-style:italic;line-height:1.5}
  .refl{font-size:15px;color:var(--petrol);margin:8px 2px 0}

  .action{background:var(--hivis);border-radius:11px;padding:14px 16px;margin:16px 0 6px}
  .action b{font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;font-size:13px;letter-spacing:.08em;color:var(--petrol);display:block;margin-bottom:3px}
  .action span{font-size:15px;color:var(--petrol)}

  /* slim sell bar, not a pitch block */
  .sellbar{border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-top:18px;background:var(--panel)}
  .sellbar .st{font-size:14px;color:var(--graphite);line-height:1.45;margin-bottom:10px}
  .sellbar .st b{color:var(--petrol)}
  .sellbar button{padding:13px}
  .foot{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8ea3ac;margin-top:16px;text-align:center}
  .fld{margin-bottom:10px}
</style>
</head>
<body>
<div class="app">
  <div class="appbar">
    <div class="brand"><span class="dot"></span><span class="nm">Leak Finder</span></div>
    <span class="barstep" id="barstep"></span>
  </div>
  <div class="screen" id="app"></div>
</div>

<script>
(function(){
  /* =================== CONFIG =================== */
  var CONFIG = {
    JACK_WA: "353894794158",
    WORKER_URL: "https://cork-leak.jackoregan505.workers.dev",
    WEEKS: 48, ADMIN_RATE: 25, TRADE_RATE: 45, CAPTURE: 0.30, DESK_FLOOR: 3500, TOTAL_SHARE: 0.15, BIZ: "Cork"
  };

  /* =================== TRADE TEXTURE =================== */
  var TRADE = {
    "Landscaping / gardens":{unit:"job", missed:"a clearance or a maintenance round", quote:"landscaping quote", inv:"the maintenance invoices"},
    "Plumbing / heating":{unit:"callout", missed:"an emergency callout or a boiler job", quote:"bathroom or boiler quote", inv:"the callout invoices"},
    "Electrical":{unit:"job", missed:"a fault callout or a rewire", quote:"rewire or board quote", inv:"the cert and job invoices"},
    "Building / carpentry":{unit:"job", missed:"an extension or a fit-out enquiry", quote:"extension quote", inv:"the stage invoices"},
    "Roofing / groundworks":{unit:"job", missed:"a storm-damage or a re-roof callout", quote:"roofing quote", inv:"the job invoices"},
    "Another trade":{unit:"job", missed:"a callout or a new enquiry", quote:"quote", inv:"the invoices"}
  };
  function tx(a){ return TRADE[a.type] || TRADE["Another trade"]; }

  /* =================== QUESTIONS =================== */
  var QUESTIONS = [
    {id:"type", q:"What's your trade?", type:"chips",
      opts:["Landscaping / gardens","Plumbing / heating","Electrical","Building / carpentry","Roofing / groundworks","Another trade"]},
    {id:"fork", q:"If I could hand you one of these on Monday morning, which do you take?", type:"chips",
      opts:[
        {t:"Two evenings a week back off the desk and the phone", v:"More time and money out of the work I've already got"},
        {t:"The phone hopping with new work I've the room to take", v:"More customers, I've room to take on more"},
        {t:"Both, but if I'm straight it's the time that's killing me", v:"Both, but time is the tighter one"}
      ]},
    {id:"jobValue", q:"What do you charge for one average [unit]?", type:"number", prefix:"€", hint:"Not your biggest job, the bread and butter one. Rough is grand, it never leaves your phone."},
    {id:"jobsWeek", q:"How many of those [unit]s do you turn out in a normal week?", type:"number", hint:"The whole business, not just you."},
    {id:"missed", q:"You're up a ladder, hands full, and the phone goes. In a week, how many of those do you never ring back?", type:"chips",
      opts:[
        {t:"None. Every missed call gets a ring back, no exceptions", v:"None, we catch everything"},
        {t:"A couple slip through, but I catch most of them", v:"1 to 3"},
        {t:"A good few, and I'd say half never hear back from me", v:"4 to 10"},
        {t:"Haven't a clue, and that's probably the answer right there", v:"No idea, honestly"}
      ]},
    {id:"quotes", q:"A fella stops you and asks what it'd cost. What actually happens after that?", type:"chips",
      opts:[
        {t:"He gets a price out of me before I leave the drive", v:"On the spot, there and then"},
        {t:"I write it up that night at the kitchen table", v:"Written up that evening"},
        {t:"It rattles around in my head for days before it's sent", v:"Days later, when I get to it"},
        {t:"Truth be told, a fair few never get sent at all", v:"Some never get sent at all"}
      ]},
    {id:"priceRaise", q:"When did you last put your prices up, and did it sting to do it?", type:"chips",
      opts:[
        {t:"This past year, and it barely got a murmur off anyone", v:"Within the last year"},
        {t:"A year or two back now", v:"One to three years ago"},
        {t:"Longer ago than I'd want to admit to you", v:"Longer than that"},
        {t:"Never. Same prices for years while everything else went up", v:"Never, honestly"}
      ]},
    {id:"admin", q:"Be straight with me. How much of your week gets eaten by the desk, the phone and the chasing?", type:"chips",
      opts:[
        {t:"Next to nothing, I keep on top of it", v:"Under 2"},
        {t:"An evening or two gone to it every week", v:"2 to 5"},
        {t:"The guts of a full day, every single week", v:"5 to 10"},
        {t:"More than a day. It's eating into family time now", v:"More than 10"}
      ]},
    {id:"tried", q:"Have you had a go at fixing this yourself before now?", type:"chips",
      opts:[
        "Tried a few bits, nothing ever stuck",
        "Keep meaning to, never get round to it",
        "Paid for something once, waste of money",
        "No. I just put the head down and grind through it"
      ]},
    {id:"story_head", q:"Last one. If you could hand one job off tomorrow and never touch it again, what is it? The bit that does your head in.", type:"story",
      hint:"Type it or just talk it out, whatever suits. This is the bit I actually fix."}
  ];

  /* =================== STATE =================== */
  var app = document.getElementById("app");
  var barstep = document.getElementById("barstep");
  var screen = "intro", step = 0, answers = {}, report = null;

  function euro(n){ return "€" + Math.round(Number(n)||0).toLocaleString("en-IE"); }
  function setStep(s){ barstep.textContent = s || ""; }

  var MID = {
    admin:{"Under 2":1.5,"2 to 5":3.5,"5 to 10":7.5,"More than 10":12},
    missed:{"None, we catch everything":0,"1 to 3":2,"4 to 10":7,"No idea, honestly":4},
    price:{"Within the last year":0.03,"One to three years ago":0.06,"Longer than that":0.10,"Never, honestly":0.12},
    quoteLoss:{"On the spot, there and then":0,"Written up that evening":0.05,"Days later, when I get to it":0.12,"Some never get sent at all":0.20},
    invRisk:{"Same day":0,"Within the week":0.01,"Two weeks or more":0.03,"Whenever I remember":0.05}
  };

  /* =================== LEAK MATHS (mirror of the Worker) =================== */
  function analyse(a){
    var t = tx(a);
    var jobValue = Number(a.jobValue)||0, jobsWeek = Number(a.jobsWeek)||0;
    var annualRev = jobValue * jobsWeek * CONFIG.WEEKS;
    var adminHrs = MID.admin[a.admin] || 0;
    var isCapacity = (a.fork||"").indexOf("More time") === 0 || (a.fork||"").indexOf("Both") === 0;
    var rate = isCapacity ? CONFIG.TRADE_RATE : CONFIG.ADMIN_RATE;

    var priceF = MID.price[a.priceRaise] || 0, invF = MID.invRisk[a.invoicing] || 0;
    var quoteF = MID.quoteLoss[a.quotes] || 0, missedCount = MID.missed[a.missed] || 0;
    var undercharge = Math.round(annualRev * priceF);
    var adminCost = Math.round(adminHrs * rate * CONFIG.WEEKS);
    var invCost = Math.round(annualRev * invF);
    var missedCost = Math.round(missedCount * CONFIG.CAPTURE * jobValue * CONFIG.WEEKS);
    var quoteCost = Math.round(annualRev * quoteF);
    var invCap = t.inv.charAt(0).toUpperCase()+t.inv.slice(1);

    var leaks = [];
    if(isCapacity){
      if(undercharge>0) leaks.push({title:"Charging too little",cost:undercharge,mk:function(c){
        return "You do about "+jobsWeek+" "+t.unit+"s a week at "+euro(jobValue)+" each, near enough "+euro(annualRev)+" a year. Your prices are "+(priceF>=0.1?"well overdue a rise":"due a nudge")+". A rise your good clients will not flinch at is "+euro(c)+" a year for the exact same work.";}});
      if(adminCost>=CONFIG.DESK_FLOOR) leaks.push({title:"Your own time on the desk",cost:adminCost,mk:function(c){
        return "About "+adminHrs+" hours a week goes on the desk instead of on the tools or at home. Valued at your skilled rate that is "+euro(c)+" a year sat doing paperwork.";}});
      if(invCost>0) leaks.push({title:"Money sitting out there",cost:invCost,mk:function(c){
        return invCap+" go out '"+(a.invoicing||"").toLowerCase()+"'. Money you have already earned sits unpaid, and some of it quietly never comes in. Conservatively that is "+euro(c)+" a year at risk.";}});
    } else {
      if(missedCost>0) leaks.push({title:"Enquiries going cold",cost:missedCost,mk:function(c){
        return "About "+missedCount+" calls a week you cannot get to. If even "+Math.round(CONFIG.CAPTURE*100)+"% of a missed "+t.missed+" would have booked at "+euro(jobValue)+" a "+t.unit+", that is "+euro(c)+" a year walking to whoever answered instead.";}});
      if(quoteCost>0) leaks.push({title:"Quotes that go stale",cost:quoteCost,mk:function(c){
        return "Your "+t.quote+"s get done '"+(a.quotes||"").toLowerCase()+"'. A quote that lands days late, or never, is a "+t.unit+" someone else took. On your numbers that is roughly "+euro(c)+" a year.";}});
      if(adminCost>=CONFIG.DESK_FLOOR) leaks.push({title:"Time lost to paperwork",cost:adminCost,mk:function(c){
        return "About "+adminHrs+" hours a week goes on admin. Put back into the work or your evenings that is worth about "+euro(c)+" a year.";}});
    }

    leaks.sort(function(x,y){return y.cost-x.cost;});
    leaks = leaks.slice(0,3);

    /* believability: cap the TOTAL at a share of turnover and scale proportionally,
       so leaks stay distinct and calculated-looking, never identical capped figures. */
    var rawTotal = leaks.reduce(function(s,l){return s+l.cost;},0);
    var totalCap = Math.round(annualRev * CONFIG.TOTAL_SHARE);
    if(totalCap>0 && rawTotal>totalCap){
      var f = totalCap/rawTotal;
      for(var k=0;k<leaks.length;k++) leaks[k].cost = Math.round(leaks[k].cost * f);
    }
    for(var j=0;j<leaks.length;j++) leaks[j].why = leaks[j].mk(leaks[j].cost);
    var total = leaks.reduce(function(s,l){return s+l.cost;},0);
    var strong = total >= 8000;
    var headline;
    if(leaks.length===0) headline = "You run a genuinely tight ship. Nothing here worth chasing, and that is a good answer to have.";
    else if(strong) headline = isCapacity ? "You are not short of work. You are leaving money and hours on the table." : "There is real money slipping out the side of the business every week.";
    else headline = isCapacity ? "You run a fairly tight ship. Here is the money still worth going after." : "Not a lot is slipping. There is still a bit worth tightening up.";

    var quickWin = isCapacity
      ? "Add 10% to the next "+t.quote+" you send. Nobody good will blink, and it is money for nothing changed."
      : "Set an instant text back on your missed calls this week. It holds the "+t.unit+" while you finish the one you are on.";

    var story = (a.story_head||"").trim() || (a.story_paid||"").trim();
    var reflection = (story && leaks.length)
      ? "You felt that before you saw the figure. What you just described is Leak 1 up there, "+euro(leaks[0].cost)+" a year."
      : "";
    return {total:total, headline:headline, leaks:leaks, quickWin:quickWin, reflection:reflection, capacity:isCapacity};
  }

  /* =================== RENDER =================== */
  function qText(qq){ return qq.q.indexOf("[unit]")>-1 ? qq.q.replace(/\[unit\]/g, tx(answers).unit) : qq.q; }

  function render(){
    if(screen==="intro"){
      setStep("");
      app.innerHTML = '<div class="panel">'+
        '<h1>You are flat out every week. So where is the <span class="red">money going</span>?</h1>'+
        '<p>Answer a few straight questions about how the business actually runs. This costs your biggest money leaks in euro, off your own numbers, and points at the one that is costing you most.</p>'+
        '<p style="margin-bottom:18px">About three minutes. Type your answers or talk them out. Your figures stay on your phone, nothing is saved.</p>'+
        '<button class="big" id="start">Show me where</button>'+
        '</div>'+
        '<p class="foot">Built by Jack, a Cork lad who finds where trades lose money and plugs it.</p>';
      document.getElementById("start").onclick = function(){ screen="quiz"; step=0; render(); };
      return;
    }

    if(screen==="quiz"){
      var qq = QUESTIONS[step];
      setStep((step+1)+" / "+QUESTIONS.length);
      var pct = Math.round((step/QUESTIONS.length)*100);
      var body = '<div class="prog"><div class="fill" style="width:'+pct+'%"></div></div>'+
        '<div class="panel"><div class="qnum">Question '+(step+1)+'</div>'+
        '<h2>'+qText(qq)+'</h2>'+ (qq.hint?'<p style="margin:0 0 16px">'+qq.hint+'</p>':'<div style="height:14px"></div>');
      var backBtn = step>0 ? '<button class="ghost" id="bk">&#8592; Back</button>' : '';

      if(qq.type==="chips"){
        for(var i=0;i<qq.opts.length;i++){
          var o = qq.opts[i];
          var lab = (o && typeof o === "object") ? o.t : o;
          var val = (o && typeof o === "object") ? o.v : o;
          var on = (answers[qq.id]===val) ? " on" : "";
          body += '<button class="chip'+on+'" data-v="'+val.replace(/"/g,'&quot;')+'">'+lab+'</button>';
        }
        body += backBtn + '</div>';
        app.innerHTML = body;
        var chips = app.querySelectorAll(".chip");
        for(var c=0;c<chips.length;c++) chips[c].onclick = (function(ch){return function(){ next(qq.id, ch.getAttribute("data-v")); };})(chips[c]);
        var bk1=document.getElementById("bk"); if(bk1) bk1.onclick=goBack;
        return;
      }
      if(qq.type==="number"){
        body += '<div class="numrow">'+(qq.prefix?'<span class="pre">'+qq.prefix+'</span>':'')+
          '<input type="number" inputmode="numeric" id="num" placeholder="0"></div>'+
          '<button class="big" id="nx" disabled>Next</button>'+ backBtn + '</div>';
        app.innerHTML = body;
        var num = document.getElementById("num"), nx = document.getElementById("nx");
        if(answers[qq.id]!=null && answers[qq.id]!==""){ num.value = answers[qq.id]; nx.disabled = !(Number(num.value)>0); }
        num.oninput = function(){ nx.disabled = !(num.value && Number(num.value)>0); };
        nx.onclick = function(){ if(num.value && Number(num.value)>0) next(qq.id, Number(num.value)); };
        var bk2=document.getElementById("bk"); if(bk2) bk2.onclick=goBack;
        num.focus();
        return;
      }
      if(qq.type==="story"){
        body += '<textarea id="story" placeholder="Type here, or tap the mic and talk..."></textarea>'+
          '<p class="micnote">Type it, or tap the microphone on your keyboard and just talk. Your call.</p>'+
          '<button class="big" id="nx">Next</button>'+
          '<button class="ghost" id="skip">Skip this one</button>'+ backBtn + '</div>';
        app.innerHTML = body;
        var ta = document.getElementById("story");
        if(answers[qq.id]) ta.value = answers[qq.id];
        document.getElementById("nx").onclick = function(){ next(qq.id, ta.value.trim()); };
        document.getElementById("skip").onclick = function(){ next(qq.id, ""); };
        var bk3=document.getElementById("bk"); if(bk3) bk3.onclick=goBack;
        return;
      }
    }

    if(screen==="analysing"){
      setStep("");
      app.innerHTML = '<div class="panel" style="text-align:center;padding:44px 20px">'+
        '<div style="font-family:\'Barlow Condensed\',sans-serif;font-weight:800;font-size:28px;text-transform:uppercase;margin-bottom:10px">Running your numbers</div>'+
        '<div class="mono" id="busyLine" style="font-size:14px;color:var(--graphite)">Checking the pipes...</div></div>';
      var lines = ["Checking the pipes...","Costing the leaks...","Running your numbers...","Writing up the findings..."];
      var bi=0; if(window.__busy) clearInterval(window.__busy);
      window.__busy = setInterval(function(){ bi=(bi+1)%lines.length; var e=document.getElementById("busyLine"); if(e){ e.textContent=lines[bi]; } else { clearInterval(window.__busy); } }, 1400);
      return;
    }

    if(screen==="report" && report){
      if(window.__busy){ clearInterval(window.__busy); window.__busy=null; }
      setStep("Report");
      var weekly = Math.round(report.total/CONFIG.WEEKS);
      var top = report.leaks.length ? report.leaks[0].cost : 1;
      var inner = '<div class="metric"><div class="ml">Estimated annual leak</div>'+
        '<div class="mv">'+euro(report.total)+'</div>'+
        (report.leaks.length ? '<div class="mw"><b>'+euro(weekly)+'</b> every week you leave it</div>' : '')+
        '</div>'+
        '<p class="readline">'+report.headline+'</p>';

      for(var i=0;i<report.leaks.length;i++){
        var l = report.leaks[i];
        var w = Math.max(8, Math.round(l.cost/top*100));
        var openCls = i===0 ? " open" : "";
        inner += '<div class="tile'+(i===0?" p1":"")+openCls+'" data-i="'+i+'">'+
          '<div class="thead">'+
            '<span class="rank">'+(i+1)+'</span>'+
            '<div class="tmid"><div class="ttitle">'+l.title+'</div><div class="tsev"><i style="width:'+w+'%"></i></div></div>'+
            '<span class="tcost">'+euro(l.cost)+'/yr</span>'+
            '<span class="caret">&#9656;</span>'+
          '</div>'+
          '<div class="tbody"><div class="in"><p class="why">'+l.why+'</p></div></div>'+
        '</div>';
      }

      var rawStory = (answers.story_head||"").trim() || (answers.story_paid||"").trim();
      if(rawStory && report.leaks.length){
        inner += '<div class="words"><div class="wl">In your own words</div><div class="wt">“'+rawStory.replace(/</g,"&lt;")+'”</div></div>';
        if(report.reflection) inner += '<p class="refl">'+report.reflection.replace(/</g,"&lt;")+'</p>';
      }
      if(report.leaks.length){
        inner += '<div class="action"><b>One free win to get you started</b><span>'+report.quickWin+'</span></div>';
      }

      /* slim sell bar, not a pitch block. anchors the price to their own number, sells the money back not the tools */
      var sell;
      if(report.leaks.length){
        sell = '<div class="st">That free win is one small patch. The <b>'+euro(report.total)+' a year</b> above is the full job, and the biggest leak is not a this-week fix, it needs a proper look. The paid <b>assessment</b> is a 15 minute call, then a written plan that goes and gets that money back, leak by leak. <b>€499</b> to recover it, my first three Cork trades, €999 after.</div>'+
          '<button class="big" id="fix">Book the call about your '+euro(report.total)+'</button>';
      } else {
        sell = '<div class="st">You run a tight ship, so there is no big leak to chase here. If you want a proper set of eyes over the whole business anyway, the paid <b>assessment</b> is a 15 minute call and a written plan. <b>€499</b>, my first three Cork trades, €999 after.</div>'+
          '<button class="big" id="fix">Book a 15 minute call</button>';
      }
      inner += '<div class="sellbar">'+sell+'</div>'+
        '<p class="foot">15 minutes, no charge, no hard sell. Assessment by Jack, '+CONFIG.BIZ+'</p>';

      app.innerHTML = inner;
      var tiles = app.querySelectorAll(".tile");
      for(var ti=0; ti<tiles.length; ti++){
        tiles[ti].querySelector(".thead").onclick = (function(el){ return function(){ el.classList.toggle("open"); }; })(tiles[ti]);
      }
      document.getElementById("fix").onclick = function(){ screen="capture"; render(); };
      return;
    }

    if(screen==="capture"){
      setStep("Book");
      app.innerHTML = '<div class="panel">'+
        '<h2>Book your 15 minute call</h2>'+
        '<p>You are probably thinking this is where the sales calls start. Fair enough. It is one call, 15 minutes, no charge and no hard sell. If it is not worth your time you will know inside five minutes.</p>'+
        '<p>Leave your details and I will sort a time that suits.</p>'+
        '<div class="fld"><input id="cname" placeholder="Your name"></div>'+
        '<div class="fld"><input id="cbiz" placeholder="Business name"></div>'+
        '<div class="fld"><input id="cphone" placeholder="Phone or WhatsApp"></div>'+
        '<button class="big" id="send">Book it with Jack</button>'+
        '<button class="ghost" id="back">Back to my results</button>'+
        '</div>';
      document.getElementById("back").onclick = function(){ screen="report"; render(); };
      document.getElementById("send").onclick = function(){
        var name = (document.getElementById("cname").value||"").trim();
        var biz = (document.getElementById("cbiz").value||"").trim();
        var phone = (document.getElementById("cphone").value||"").trim();
        var lines = ["Hi Jack, I did the leak assessment and want to book the 15 minute call about the full assessment."];
        if(name) lines.push("Name: "+name);
        if(biz) lines.push("Business: "+biz);
        if(phone) lines.push("Phone: "+phone);
        lines.push("Trade: "+(answers.type||"?"));
        lines.push("Estimated annual leak: "+euro(report.total));
        for(var i=0;i<report.leaks.length;i++) lines.push("- "+report.leaks[i].title+": "+euro(report.leaks[i].cost)+"/yr");
        var url = "https://wa.me/"+CONFIG.JACK_WA+"?text="+encodeURIComponent(lines.join("\n"));
        window.open(url,"_blank");
      };
      return;
    }
  }

  function next(id, val){
    answers[id] = val;
    if(step+1 < QUESTIONS.length){ step++; render(); }
    else { runReport(); }
  }
  function goBack(){ if(step>0){ step--; render(); } }

  function runReport(){
    report = null; screen = "analysing"; render();
    if(!CONFIG.WORKER_URL){ setTimeout(function(){ report = analyse(answers); screen="report"; render(); }, 700); return; }
    var done = false;
    function fallback(){ if(done) return; done=true; report = analyse(answers); screen="report"; render(); }
    var timer = setTimeout(fallback, 20000);
    fetch(CONFIG.WORKER_URL, {method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify(answers)})
      .then(function(r){ return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function(rep){
        if(done) return; done=true; clearTimeout(timer);
        report = (rep && rep.leaks && rep.leaks.length && !rep.error) ? rep : analyse(answers);
        screen="report"; render();
      })
      .catch(function(){ clearTimeout(timer); fallback(); });
  }

  render();
})();
</script>
</body>
</html>
